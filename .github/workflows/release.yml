name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ amd64, 386 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/GoKeyMux.exe .
          go build -trimpath -ldflags "-s -w" -o dist/keycycle.exe ./cmd/keycycle
          go build -trimpath -ldflags "-s -w" -o dist/loadtest.exe ./cmd/loadtest

      - name: Bundle runtime deps
        run: |
          Copy-Item -Recurse Interception dist/
          Copy-Item -Recurse proto dist/
          if ('${{ matrix.arch }}' -eq 'amd64') { Copy-Item FakerInput_Setup_0.1.1_x64.msi dist/ }

      - name: Zip
        run: Compress-Archive -Path dist\* -DestinationPath GoKeyMux-windows-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoKeyMux-windows-${{ matrix.arch }}
          path: GoKeyMux-windows-${{ matrix.arch }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
