name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          $Commit = git rev-parse --short HEAD 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $Commit) { $Commit = $env:GITHUB_SHA }
          $BuildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $LdFlags = "-X GoKeyMux/version.Version=dev -X GoKeyMux/version.Commit=$Commit -X GoKeyMux/version.BuildTime=$BuildTime"
          go build -ldflags $LdFlags -o build/GoKeyMux.exe .
          go build -o build/keycycle.exe ./cmd/keycycle
          go build -o build/loadtest.exe ./cmd/loadtest
